dataset:
  name: plankton54
  num_classes: 54
  pre_size: 256
  image_size: 224
  interpolation: bilinear
  normalization_type: plankton54
  num_workers: '@{num_workers}'
  num_gpus: '@{num_gpus}'
  num_machines: '@{num_machines}'
  split_names: [train, val, test]

  train:
    dataset_class: ImglistDataset
    data_dir: ./data/DYB-PlanktonNet/
    imglist_pth: ./data/benchmark_imglist/plankton54/ID_train.txt
    batch_size: 64
    shuffle: True

  val:
    dataset_class: ImglistDataset
    data_dir: ./data/DYB-PlanktonNet/
    imglist_pth: ./data/benchmark_imglist/plankton54/ID_val.txt
    batch_size: 64
    shuffle: False

  test:
    dataset_class: ImglistDataset
    data_dir: ./data/DYB-PlanktonNet/
    imglist_pth: ./data/benchmark_imglist/plankton54/ID_test.txt
    batch_size: 64
    shuffle: False

  ood:
    dataset_class: ImglistDataset
    data_dir: ./data/DYB-PlanktonNet/
    imglist_pth: ./data/benchmark_imglist/plankton54/plankton_near_val.txt
    batch_size: 64
    shuffle: False




